[pytest]
# This configuration is intentionally scoped to the FinNLP research package.
testpaths = tests
python_files = test_*.py
pythonpath = ..

# Keep repository-wide pytest discovery away from historical projects,
# archived implementations, and unrelated SDK/application test suites.
norecursedirs =
    .git
    __pycache__
    .pytest_cache
    notebooks
    protocols
    finverify-sdk
    finverify-terminal
    phase9c_run3_extract
    phase9c_run3_premerge_files
    archives
    archive
    historical

addopts =
    --ignore=finverify-bench
    --ignore=finverify-sdk
    --ignore=finverify-terminal
    --ignore=finverify-extension
    --ignore=phase9c_run3_extract
    --ignore=phase9c_run3_premerge_files
