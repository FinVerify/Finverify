name: Deploy Backend to Hugging Face

on:
  push:
    branches:
      - main
    paths:
      - "finverify-terminal/backend/**"
      - ".github/workflows/deploy-hf.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Clone Hugging Face Space
        env:
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git clone https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/finverify-api hf-space

      - name: Remove old backend files
        run: |
          find hf-space -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name "README.md" \
            ! -name ".gitattributes" \
            ! -name ".gitignore" \
            -exec rm -rf {} +

      - name: Copy backend
        run: |
          rsync -a \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='.pytest_cache/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='*.pyo' \
            --exclude='*.db' \
            --exclude='data/' \
            finverify-terminal/backend/ \
            hf-space/

      - name: Commit and Push
        run: |
          cd hf-space

          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"

          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Auto deploy backend from GitHub"
            git push origin HEAD:main
          else
            echo "No backend changes to deploy."
          fi