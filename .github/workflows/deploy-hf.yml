name: Deploy Backend to Hugging Face

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Clone HF Space
        env:
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git clone https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/finverify-api hf-space

      - name: Sync backend
        run: |
          rsync -a --delete \
            --exclude='.git' \
            finverify-terminal/backend/ \
            hf-space/

      - name: Commit & Push
        run: |
          cd hf-space

          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"

          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Auto deploy backend from GitHub"
            git push origin main
          else
            echo "No changes to deploy."
          fi
